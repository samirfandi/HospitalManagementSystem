<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ajouter patient</title>
</head>
<body>
    <div layout:fragment="content" class="d-flex justify-content-center">

        <div class="card col-lg-7 my-4">
            <div class="card-header"> Add a new patient </div>



            <div class="card-body ">
               <!-- row g-2-->
                <form method="post" th:action="@{/admin/addPatient}" th:object="${patient}"  class=" d-flex align-items-start flex-column gap-3">
                    <div>
                        <label> First name :</label>
                        <input type="text" th:field="*{nom}" th:errorclass="is-invalid"/>
                         <div  th:errors="${patient.nom}"  class="invalid-feedback" ></div>
                    </div>

                    <div>
                        <label> Last name :</label>
                        <input type="text" th:field="*{prenom}" th:errorclass="is-invalid"/>
                         <div class="invalid-feedback" th:errors="${patient.prenom}"></div>
                    </div>

                    <div>
                        <label> Date of birth :</label>
                        <input type="date" th:field="*{dateNaissance}" />
                    </div>
                    <div>
                        <label > Sick : </label>
                        <input type="checkbox"  value="true" th:field="*{malade}"/>
                    </div>
                    <div>
                        <label >Score : </label>
                        <input type="number" name="score" value="0" th:field="*{score}" th:errorclass="is-invalid"/>
                        <div class="invalid-feedback" th:errors="${patient.score}"></div>
                    </div>
                    <div>
                        <button type="submit" class="btn btn-success" > Add patient  </button>
                    </div>
                    
                </form>

            </div>
        </div>


        

    </div>
    
</body>
</html>
