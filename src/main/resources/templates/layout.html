
<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Layout</title>

    <link rel="stylesheet"
          href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css">

    <link rel="stylesheet"
          href="/webjars/bootstrap-icons/1.13.1/font/bootstrap-icons.css">

    <script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>

</head>

<body class="vh-100">

    <header style="height: 13%;background-color: rgb(95, 21, 190);">

        <nav class="navbar navbar-expand-lg bg-body-tertiary h-100">

            <div class="container-fluid ">

                <span class="navbar-brand" >
                    <i class="bi bi-hospital"></i>
                    HMS
                </span>

                

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/user/index}">Home</a>
                        </li>

                        

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle"
                                href="#"
                                role="button"
                                data-bs-toggle="dropdown">
                                Patients
                            </a>

                            <ul class="dropdown-menu">
                                <li th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
                                    <a class="dropdown-item" th:href="@{/admin/addPatientForm}">
                                        Add new patient
                                    </a>
                                </li>
                                <li>
                                    <!-- 
                                    <a class="dropdown-item" th:href="@{/user/index}">
                                        List patients
                                    </a>
                                    -->
                                </li>
                            </ul>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" th:href="@{/user/about}">About</a>
                        </li>

                    </ul>

                    <!-- Le menu utilisateur à droite -->
                    <ul class="navbar-nav">

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle "
                                href="#"
                                role="button"
                                data-bs-toggle="dropdown"
                                aria-expanded="false"
                                sec:authentication="name">
                            </a>

                            <ul class="dropdown-menu dropdown-menu-end">
                                <li>
                                    <form method="post" th:action="@{/login}">
                                        <button class="dropdown-item" type="submit">
                                            Logout
                                        </button>

                                    </form>
                                    
                                </li>
                            </ul>
                        </li>

                    </ul>

                </div>

            </div>

        </nav>

    </header>

    <main class="container mt-4">

        <section layout:fragment="content">

            Contenu de la page

        </section>

    </main>

    <!-- 
    <footer class="container mt-4">
            <div>
                <p>Utilisateur :</p>
                <span sec:authentication="name"></span>

                <p>Authentifié :</p>
                <span sec:authentication="authenticated"></span>
            </div>

        <p>Footer</p>

    </footer>
    -->

</body>
</html>
